<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wumpwump-dl viewer</title>
<style>
  :root { --bg: #313338; --bg-secondary: #2b2d31; --text: #dbdee1; --text-muted: #949ba4; --accent: #5865f2; --border: #3f4147; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'gg sans', 'Noto Sans', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.375; }
  .load-prompt { text-align: center; padding: 80px 20px; }
  .load-prompt h1 { font-size: 20px; margin-bottom: 8px; }
  .load-prompt p { color: var(--text-muted); margin-bottom: 16px; }
  .load-prompt button { background: var(--accent); color: white; border: none; padding: 10px 24px; border-radius: 4px; font-size: 14px; cursor: pointer; }
  .drop-zone { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; font-size: 24px; color: white; }
  .drop-zone.active { display: flex; }
</style>
</head>
<body>
<div class="drop-zone" id="dropZone">Drop JSON file here</div>
<div id="app">
  <div class="load-prompt">
    <h1>wumpwump-dl viewer</h1>
    <p>Drop a JSON export file here or click to browse.</p>
    <button id="loadBtn">Choose File</button>
  </div>
</div>
<script>
  // Standalone viewer — loads JSON via file picker or drag-and-drop
  // The exported HTML files have the full renderer embedded; this is a lightweight fallback
  document.getElementById('loadBtn').addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          document.getElementById('app').textContent = 'Loaded ' + data.messages.length + ' messages from #' + data.channel.name + '. Use the exported HTML file for the full viewer.';
        } catch (err) { alert('Invalid JSON: ' + err.message); }
      };
      reader.readAsText(e.target.files[0]);
    };
    input.click();
  });
</script>
</body>
</html>
