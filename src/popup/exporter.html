<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; min-height: auto; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .container { max-width: 420px; text-align: center; }
    .media-errors { margin-top: 10px; text-align: left; font-size: 11px; color: var(--text-muted); max-height: 200px; overflow-y: auto; background: var(--bg-secondary); border-radius: 6px; padding: 8px 10px; }
    .media-errors-heading { color: #fab387; font-weight: 600; margin-bottom: 4px; }
    .media-error-item { word-break: break-all; padding: 2px 0; border-bottom: 1px solid var(--border); }
    .media-error-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>wumpwump-dl</h1>
    <div id="exportStatus" class="export-status" style="display:none"></div>
    <div id="doneMessage" class="status" style="display:none">Export complete! You can close this tab.</div>
    <div id="doneDonate" class="donate" style="display:none">
      <div class="donate-label">Support development:</div>
      <div class="donate-links">
        <a href="https://github.com/sponsors/chardidathing" target="_blank" rel="noopener" class="donate-link"><img src="github.svg" alt="GitHub" class="donate-icon">GitHub Sponsors</a>
        <span class="donate-sep">&middot;</span>
        <a href="https://ko-fi.com/supportchardidathing" target="_blank" rel="noopener" class="donate-link"><img src="kofi.svg" alt="Ko-fi" class="donate-icon donate-icon-kofi">Ko-fi</a>
      </div>
      <div class="donate-links">
        <a href="https://github.com/chardidathing/wumpwump-dl" target="_blank" rel="noopener" class="donate-link">⭐ Star on GitHub</a>
      </div>
    </div>
  </div>
  <script src="exporter-page.js"></script>
</body>
</html>
